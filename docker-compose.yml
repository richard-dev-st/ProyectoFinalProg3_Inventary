services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Express
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=InventarioBP4;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      JwtSettings__Issuer: ProyectoFinalProg3_Inventory
      JwtSettings__Audience: ProyectoFinalProg3_Inventory
      Documentos__RutaBase: /app/uploads
      Frontend__BaseUrl: ${FRONTEND_BASE_URL:-http://localhost:5299}
      EmailSettings__SmtpServer: ${SMTP_SERVER}
      EmailSettings__SmtpPort: ${SMTP_PORT}
      EmailSettings__SenderEmail: ${SMTP_USER}
      EmailSettings__SenderPassword: ${SMTP_PASSWORD}
      EmailSettings__UseSsl: ${SMTP_USE_SSL}
      ApiExterna__BaseUrl: https://api.currencyapi.com/v3
      ApiExterna__ApiKey: ${EXCHANGE_RATE_API_KEY}
      ApiExterna__TimeoutSeconds: "10"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - documents_data:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5299:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Desde el contenedor, `localhost` sería el propio frontend: se usa el servicio api.
      ApiBaseUrl: http://api:8080
    depends_on:
      - api
    volumes:
      # Evita que un recreate regenere las claves y rompa la sesión/antiforgery.
      - frontend_keys_data:/root/.aspnet/DataProtection-Keys

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=InventarioBP4;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
      EmailSettings__SmtpServer: ${SMTP_SERVER}
      EmailSettings__SmtpPort: ${SMTP_PORT}
      EmailSettings__SenderEmail: ${SMTP_USER}
      EmailSettings__SenderPassword: ${SMTP_PASSWORD}
      EmailSettings__UseSsl: ${SMTP_USE_SSL}
    depends_on:
      db:
        condition: service_healthy

volumes:
  sqlserver_data:
  documents_data:
  frontend_keys_data: