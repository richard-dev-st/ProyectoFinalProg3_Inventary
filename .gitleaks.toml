title = "Gitleaks: reglas por defecto + proteccion para contraseñas de configuracion (SMTP)"

[extend]
useDefault = true

# Captura App Passwords de Gmail / claves SMTP reales puestas en un archivo de configuracion
# (patron tipico: "SenderPassword": "abcdefghijklmnop"  o  SenderPassword=abcdefghijklmnop)
[[rules]]
id = "smtp-app-password"
description = "Posible contraseña real de SMTP/app password en un archivo de configuracion"
regex = '''(?i)(?:"(?:senderpassword|password|passwd|apppassword)"\s*[:=]\s*")([a-z][a-z0-9]{15})(?:")'''
secretGroup = 1
entropy = 3.0

[[rules.allowlists]]
description = "placeholders de configuracion que no son secretos"
regexTarget = "line"
regexes = [
  '''(?i)(tu_|your_|your-|change_?me|xxxx|placeholder|changeme|__password|envirofile)''',
]

# Valores de ejemplo/placeholder usados en la documentacion (README). No son credenciales reales.
[allowlist]
description = "Placeholders de documentacion que no son secretos"
regexTarget = "line"
regexes = [
  '''una_clave_secreta_de_al_menos_32_caracteres_aqui''',
  '''TU_APP_PASSWORD''',
]